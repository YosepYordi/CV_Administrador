services:
  mysql:
    image: mysql:8.0
    container_name: CV_Administrador
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: CV_Administrador
      TZ: America/Lima
    ports:
      - "3306:3306"
    volumes:
      - cv_administrador_mysql:/var/lib/mysql
      - ../src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama
    container_name: cv_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - cv_ollama:/root/.ollama

volumes:
  cv_administrador_mysql:
  cv_ollama:
